name: Release runtime

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: agy-manager-linux-x64.tar.gz
            binary: agy-manager
            archive: tar
          - os: ubuntu-24.04-arm
            asset: agy-manager-linux-arm64.tar.gz
            binary: agy-manager
            archive: tar
          - os: windows-latest
            asset: agy-manager-windows-x64.zip
            binary: agy-manager.exe
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pyinstaller
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build runtime
        run: python scripts/build-runtime.py --clean
      - name: Package Linux runtime
        if: matrix.archive == 'tar'
        run: tar -C dist -czf ${{ matrix.asset }} ${{ matrix.binary }}
      - name: Package Windows runtime
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path dist/${{ matrix.binary }} -DestinationPath ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create checksums and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd release
          sha256sum agy-manager-* > SHA256SUMS
          gh release create "$TAG" agy-manager-* SHA256SUMS --generate-notes --title "agy-manager $TAG"
